services:
  postgres:
    image: postgres:16-alpine
    container_name: miraisoftnet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miraisoftnet_compro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miraisoftnet12345!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-miraisoftnet_compro}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: miraisoftnet-compro
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URI: ${DATABASE_URI}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID}
        SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
        SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID}
        SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY}
        SUPABASE_S3_REGION: ${SUPABASE_S3_REGION}
        SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./media:/app/media
      - next_cache:/app/.next/cache
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
  next_cache:
