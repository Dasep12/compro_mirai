services:
  app:
    container_name: miraisoftnet-compro
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URI: ${DATABASE_URI}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID}
        SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
        SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID}
        SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY}
        SUPABASE_S3_REGION: ${SUPABASE_S3_REGION}
        SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
